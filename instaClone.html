<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="./instaClone.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <div
        style="background-color: white; width: 400px; border: 1px solid black; height: 400px; margin: auto; margin-top: 100px; text-align: center; padding-top: 50px;   ">
        <img src="https://www.pngkey.com/png/full/2-27715_instagram-png-logo-instagram-word-logo-png.png"
            alt="Instagram Logo" style="width: 200px; height: 50px; margin-bottom: 30px;">
        <form action="none">
            <input type="text" name="username" placeholder="Phone number, username, or email"
                style="width: 300px; height: 25px; border: 1px  black; text-align: left;">
            <br><br><br>
            <input type="password" name="password" placeholder="Password"
                style="width: 300px; height: 25px; border: 1px   black; text-align:left; ">
            <br><br><br>
            <button type="submit" style="border-radius: 10px;  ">Log In</button>
            <h4 style="color: rgba(0, 0, 0, 0.566) ; ">OR</h4>
            <i class="fa-brands fa-square-facebook"></i>
            <a href="#" style="color: #385185; text-decoration: none;">Log in with Facebook</a>
            <br><br><br>
            <a href="#" style="color: #385185;text-decoration: none;">Forgot password?</a>

        </form>
        <br>

        <h4
            style="color: rgba(0, 0, 0, 0.566); border: 1px solid black; padding: 10px; background-color: #f0f0f0; text-decoration: none; height: 50px; width: 380px; text-align: center; padding-top: 50px;
  padding-right: 20px;
  padding-bottom: 20px;
  padding-left: 0.5px; ">
            Don't have an account? <a href="#" style="color: #385185; text-decoration: none;">Sign up</a></h4>


        <br><br><br>
    </div>
</body>

</html>
